# dsh-explorer bundle patch (shipped inside the package).
#
# This is the layer `dsh plugin --profile web add` applies automatically, so a
# user installs the plugin with one command and no manual patch edits.
#
# `roots` below is a SAMPLE — override it in your own profile `cordis.patch.yml`
# with your real workspace (see README), e.g.:
#
#   - id: explorer
#     config:
#       roots:
#         - 'D:\MyProject'
- insert:
    - id: explorer
      name: '@zrsio4-y/dsh-explorer'
      config:
        roots:
          - 'D:\your-workspace'
